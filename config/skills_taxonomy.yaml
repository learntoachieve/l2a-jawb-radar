# Skills taxonomy used by scoring/resume_parser.py and
# profiles/profile_manager.py to extract criteria from a resume. Terms
# are matched case-insensitively against word boundaries. All terms
# below are lowercase.
#
# `skills`   -> kind="skill"
# `roles`    -> kind="role",  weight_tier=1 (strongest signal)
# `keywords` -> kind="keyword"
#
# Skill weight_tier (1 = strongest, 2 = solid) is assigned per category:
# any skill whose category is listed under `core_skill_categories`
# becomes a tier-1 criterion; all other skill categories are tier-2.
# See scoring.resume_parser.core_skill_terms / skill_weight_tier.
#
# Covers two personas today: the original Data Analyst seed and the
# IT / Help Desk support persona (the active resume). Both share the
# generic language / scripting / cloud buckets.

# Categories whose skills are the strongest resume signal for the
# current (Help Desk / IT support) persona. Skills in these categories
# are inserted as tier-1 criteria.
core_skill_categories:
  - help_desk_support
  - operating_systems
  - identity_directory
  - itsm_tools
  - networking
  - hardware

skills:
  # ----- IT / Help Desk support (tier-1 core) -----
  help_desk_support:
    - help desk
    - service desk
    - desktop support
    - deskside support
    - technical support
    - end-user support
    - end user support
    - tier 1
    - tier 2
    - troubleshooting
    - itil
    - sla
    - knowledge base
    - sop
  operating_systems:
    - windows 10
    - windows 11
    - windows
    - macos
    - linux
    - os imaging
    - imaging
    - ssh
  identity_directory:
    - active directory
    - azure ad
    - entra id
    - group policy
    - microsoft 365
    - office 365
    - google workspace
    - sharepoint
    - intune
    - okta
  itsm_tools:
    - servicenow
    - jira
    - zendesk
    - freshservice
    - freshdesk
    - ticketing
    - remote desktop
    - rdp
    - teamviewer
  networking:
    - tcp/ip
    - dns
    - dhcp
    - vpn
    - lan
    - wan
    - vlan
    - wifi
    - wireless
    - firewall
  hardware:
    - hardware
    - bios
    - ram
    - psu
    - nic
    - printers
    - peripherals
    - pc builds
    - break-fix
    - dell

  # ----- General / shared (tier-2) -----
  languages:
    - python
    - sql
    - r
    - javascript
    - java
    - c++
    - c#
  scripting:
    - bash
    - powershell
    - shell scripting
  data_libraries:
    - pandas
    - numpy
    - scipy
    - scikit-learn
    - statsmodels
  viz:
    - plotly
    - matplotlib
    - seaborn
    - tableau
    - power bi
    - looker
    - streamlit
  databases:
    - postgresql
    - mysql
    - sqlite
    - mongodb
    - snowflake
    - bigquery
    - redshift
  tools:
    - git
    - github
    - jupyter
    - docker
    - airflow
    - dbt
    - excel
  cloud:
    - aws
    - azure
    - gcp
  concepts:
    - etl
    - eda
    - statistics
    - regression
    - classification
    - clustering
    - a/b testing
    - anomaly detection
    - data modeling
    - data warehousing

roles:
  # IT / Help Desk roles
  - help desk
  - help desk technician
  - service desk
  - desktop support
  - desktop support technician
  - it support
  - it support specialist
  - technical support
  - support specialist
  - support technician
  - it technician
  - it specialist
  - field technician
  - systems administrator
  - sysadmin
  - network administrator
  # Data / analytics roles
  - data analyst
  - business analyst
  - bi analyst
  - data scientist
  - analytics engineer
  - business intelligence
  - bi
  - reporting

# kind="keyword" — generic terms that signal relevance but are too broad
# to grant the role-style weighting (would over-trigger on JDs that
# casually mention them). Keywords contribute the smallest sub-component.
keywords:
  - analytics
  - customer service
  - documentation
  - itil foundation
  - comptia
