# Company ATS board registry — slug lists per platform.
#
# Read by scrapers/greenhouse.py, scrapers/ashby.py, scrapers/lever.py
# via _load_slugs(). Each slug is the URL path component for the
# company's public job board:
#
#   greenhouse -> https://boards.greenhouse.io/{slug}
#   lever      -> https://jobs.lever.co/{slug}
#   ashby      -> https://jobs.ashbyhq.com/{slug}
#
# 404s on any individual slug are silently skipped by the scraper,
# so a stale entry won't break the run — but it does waste an HTTP
# round-trip. Remove obsolete slugs when you notice them.
#
# This file was last audited 2026-06-03 by hitting each candidate
# against the platform's posting API; only slugs that returned 200
# with a non-empty job list remained. Common reasons a slug 404s:
#   - the company migrated ATSes (e.g. half the Greenhouse AI-lab
#     cohort moved to Ashby, then half of those got behind auth)
#   - the company turned off the public API while keeping the
#     embedded board (Anthropic does this on Ashby today)
#   - the slug name on the API differs from the public URL

greenhouse:
  - airbnb
  - stripe
  - dropbox
  - robinhood
  - reddit
  - roblox
  - twilio
  - asana
  - discord
  - klaviyo
  - affirm
  - cloudflare
  - databricks
  - planetscale
  - gusto
  - figma
  - brex
  # coinbase returned 200 with 0 open jobs at the last audit; left in
  # because it tends to open hiring in waves. Drop if it stays empty.
  - coinbase

# Every Lever public-API candidate we tested (50+, including the
# usual suspects: stripe, notion, figma, linear, brex, rippling,
# scale-ai, weights-and-biases, cohere, gitlab, mixpanel, sentry,
# calendly, postman, netlify, benchling, airtable, latticehq...)
# returned 404. Most companies that were on Lever have migrated to
# Ashby, Greenhouse, or their own ATS. Only ``pipedrive`` (26 open
# roles) currently surfaces, so the list stays intentionally small
# until we either find more real tenants or retire the scraper.
lever:
  - pipedrive

ashby:
  - openai
  - perplexity
  - cohere
  - modal
  - braintrust
  - harvey
  - sierra
  - decagon
  - linear
  - posthog
  - browserbase
  - supabase
  - replit
  - notion
  - mercor
  - weaviate
  - pinecone
  - baseten
  - neon
  - railway
